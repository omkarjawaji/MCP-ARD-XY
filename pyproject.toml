[project]
name = "mcp-gateway"
version = "0.1.0"
description = "FastMCP gateway: downstream MCP proxies, Genie-like SQL agents, agentic search, and an inbound auth/rate-limit/audit layer for testing ARD + deciders."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the Anthropic API (needs ANTHROPIC_API_KEY)"]
